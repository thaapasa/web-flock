presets = ["debian", "nodejs", "claude-code"]

[vm]
image = "claude-yarn"

[network]
policy = "deny-by-default"
# policy = "allow-always"

[network.rules.package-registry]
allow = [
    "registry.npmjs.org",
    "registry.yarnpkg.com",
    "repo.yarnpkg.com"
]

[network.rules.github]
allow = [
    "github.com",
    "raw.githubusercontent.com",
    "objects.githubusercontent.com",
    "codeload.github.com",
    "milankinen.github.io"
]

# node_modules and the Yarn cache live on the VM's ext4 disk, not on the
# VirtioFS project mount. The host is macOS and the sandbox is Linux, so the
# two must never share installed native binaries.
# These also survive a change of OCI image.
[disk.cache.node-modules]
paths = ["node_modules"]

[disk.cache.yarn]
paths = ["~/.yarn/berry/cache", "~/.cache/node/corepack"]
