<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Flock</title>

    <!-- Favicons and PWA manifest, generated with realfavicongenerator.net. -->
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Flock" />
    <link rel="manifest" href="/site.webmanifest" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      canvas {
        display: block;
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      /* Text only. It must never take the pointer events the scene needs. */
      #overlay {
        pointer-events: none;
      }
      /*
        The parameter panel sits top-left, over both canvases. The other three
        corners are spoken for: the frame-time HUD top-right, the coordinate
        readout bottom-right, the key hints bottom-left. It starts collapsed to
        its title bar, so what a stranger sees first is the flock.
      */
      #panel {
        position: absolute;
        top: 8px;
        left: 8px;
        width: 280px;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <canvas id="overlay"></canvas>
    <div id="panel"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
